spring.datasource.url=jdbc:h2:mem:minibanking-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/banfico-banking/protocol/openid-connect/certs
